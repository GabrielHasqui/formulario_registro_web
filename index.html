<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario de Registro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>

        <section>

            <h1>Formulario de Registro</h1>

            <p>
                Complete la siguiente información para realizar su registro.
            </p>

            <form id="formularioRegistro" novalidate>

                <div class="campo">
                    <label for="nombre">Nombre completo</label>

                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" autocomplete="name"
                        maxlength="80" aria-describedby="errorNombre" required>

                    <span class="mensaje-error" id="errorNombre"></span>
                </div>


                <div class="campo">
                    <label for="correo">Correo electrónico</label>

                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" autocomplete="email"
                        maxlength="120" aria-describedby="errorCorreo" required>

                    <span class="mensaje-error" id="errorCorreo"></span>
                </div>


                <div class="campo">
                    <label for="contrasena">Contraseña</label>

                    <div class="entrada-contrasena">
                        <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese una contraseña"
                            minlength="8" autocomplete="new-password" aria-describedby="errorContrasena" required>

                        <button type="button" class="boton-contrasena" id="botonContrasena"
                            aria-label="Mostrar contraseña" aria-pressed="false">
                            <i class="fa-solid fa-eye" id="iconoContrasena" aria-hidden="true"></i>
                        </button>
                    </div>

                    <span class="mensaje-error" id="errorContrasena"></span>
                </div>



                <div class="campo">
                    <label for="edad">Edad</label>

                    <input type="number" id="edad" name="edad" placeholder="Ej. 20" min="18" max="100"
                        autocomplete="off" aria-describedby="errorEdad" required>

                    <span class="mensaje-error" id="errorEdad"></span>
                </div>


                <div class="campo">
                    <label for="telefono">Teléfono</label>

                    <input type="tel" id="telefono" name="telefono" placeholder="Ej. 0991234567" autocomplete="tel"
                        inputmode="numeric" pattern="[0-9]{10}" maxlength="10" aria-describedby="errorTelefono"
                        required>

                    <span class="mensaje-error" id="errorTelefono"></span>
                </div>


                <div class="campo">
                    <label for="carrera">Carrera</label>

                    <select id="carrera" name="carrera" aria-describedby="errorCarrera" required>

                        <option value="">Seleccione una carrera</option>

                        <option value="software">
                            Ingeniería de Software
                        </option>

                        <option value="industrial">
                            Ingeniería Industrial
                        </option>

                        <option value="biotecnologia">
                            Ingeniería en Biotecnología
                        </option>

                        <option value="alimentos">
                            Ingeniería en Alimentos
                        </option>

                    </select>

                    <span class="mensaje-error" id="errorCarrera"></span>
                </div>


                <div class="campo">

                    <input type="checkbox" id="terminos" name="terminos" aria-describedby="errorTerminos" required>

                    <label for="terminos">
                        Acepto los términos y condiciones
                    </label>

                    <span class="mensaje-error" id="errorTerminos"></span>

                </div>


                <button type="submit" class="boton-registro">
                    Registrarse
                </button>


                <p id="mensajeFormulario" aria-live="polite"></p>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
